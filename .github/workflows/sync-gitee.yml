name: Sync GitHub to Gitee

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [published, edited, deleted, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync; leave empty to sync all published releases'
        required: false
        type: string

permissions:
  contents: read

# Serialize runs: uploading/replacing attachments must not overlap.
concurrency:
  group: sync-gitee
  cancel-in-progress: false

env:
  GITEE_REPO: wu-mengze233/Nautilus-s-Music-Decryptor
  GITEE_USER: wu-mengze233

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trusted sync scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync main and tags
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN" || { echo "Missing GITEE_TOKEN secret"; exit 1; }
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USER" ;;
            *) printf '%s\n' "$GITEE_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git remote add gitee "https://gitee.com/${GITEE_REPO}.git"
          git push gitee refs/remotes/origin/main:refs/heads/main
          git push gitee --tags

      - name: Sync releases and attachments
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_TAG: ${{ inputs.tag }}
        run: python tools/sync_gitee.py
